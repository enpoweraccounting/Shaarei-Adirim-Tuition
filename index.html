<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaarei Adirim Tuition Tracking Data Validation</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-danger: #fcebeb;
      --bg-success: #eaf3de;
      --text: #1a1a18;
      --text-secondary: #5f5e5a;
      --text-danger: #a32d2d;
      --text-success: #3b6d11;
      --border: rgba(0,0,0,0.12);
      --border-secondary: rgba(0,0,0,0.22);
      --border-danger: #e24b4a;
      --border-success: #639922;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1c;
        --bg-secondary: #2a2a28;
        --bg-danger: #501313;
        --bg-success: #173404;
        --text: #f0efe8;
        --text-secondary: #b4b2a9;
        --text-danger: #f09595;
        --text-success: #97c459;
        --border: rgba(255,255,255,0.12);
        --border-secondary: rgba(255,255,255,0.22);
        --border-danger: #e24b4a;
        --border-success: #639922;
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    #drop-zone {
      border: 1.5px dashed var(--border-secondary);
      border-radius: var(--radius-lg);
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 1.5rem;
    }

    #drop-zone:hover, #drop-zone.dragover {
      background: var(--bg-secondary);
    }

    #drop-zone svg {
      display: block;
      margin: 0 auto 12px;
      color: var(--text-secondary);
    }

    #drop-zone .primary {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    #drop-zone .secondary {
      font-size: 13px;
      color: var(--text-secondary);
    }

    #status {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 13px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .summary-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 1rem;
    }

    .summary-card .check-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .summary-card .check-name {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .badge-ok {
      font-size: 13px;
      color: var(--text-success);
    }

    .badge-err {
      font-size: 13px;
      color: var(--text-danger);
    }

    .issue-block {
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .issue-block.has-issues {
      border-left: 3px solid var(--border-danger);
    }

    .issue-block.all-clear {
      border-left: 3px solid var(--border-success);
    }

    .issue-block-header {
      padding: 0.75rem 1rem;
      border-bottom: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
    }

    .issue-count {
      margin-left: auto;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--bg-danger);
      color: var(--text-danger);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    td {
      padding: 8px 12px;
      border-bottom: 0.5px solid var(--border);
      vertical-align: top;
      line-height: 1.5;
    }

    td.muted {
      color: var(--text-secondary);
      white-space: nowrap;
    }

    td .sub {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      margin-top: 3px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .ok-row td {
      color: var(--text-success);
      padding: 10px 12px;
    }

    #results { display: none; }

    @media (max-width: 560px) {
      .summary-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Shaarei Adirim Tuition Tracking Data Validation</h1>
      <p>Upload the tuition payment spreadsheet to run all three monthly data quality checks.</p>
    </header>

    <div id="drop-zone"
      onclick="document.getElementById('file-input').click()"
      ondragover="event.preventDefault(); this.classList.add('dragover')"
      ondragleave="this.classList.remove('dragover')"
      ondrop="handleDrop(event)">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <polyline points="9 15 12 12 15 15"/>
      </svg>
      <p class="primary">Drop your .xlsx file here</p>
      <p class="secondary">or click to browse</p>
      <input type="file" id="file-input" accept=".xlsx" style="display:none" onchange="handleFile(this.files[0])">
    </div>

    <div id="status">⏳ <span id="status-text">Reading file...</span></div>

    <div id="results">
      <div class="summary-cards">
        <div class="summary-card">
          <p class="check-label">Check 1</p>
          <p class="check-name">Tab ↔ Summary names</p>
          <p id="badge-1"></p>
        </div>
        <div class="summary-card">
          <p class="check-label">Check 2</p>
          <p class="check-name">Month column coverage</p>
          <p id="badge-2"></p>
        </div>
        <div class="summary-card">
          <p class="check-label">Check 3</p>
          <p class="check-name">Formula consistency</p>
          <p id="badge-3"></p>
        </div>
      </div>
      <div id="issues-container"></div>
    </div>
  </div>

  <script>
    function handleDrop(e) {
      e.preventDefault();
      document.getElementById('drop-zone').classList.remove('dragover');
      const f = e.dataTransfer.files[0];
      if (f) handleFile(f);
    }

    function handleFile(file) {
      if (!file) return;
      showStatus('Reading file...');
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const wb = XLSX.read(e.target.result, {type: 'array', cellFormula: true});
          showStatus('Running validations...');
          setTimeout(() => {
            try {
              const results = runValidations(wb);
              showResults(results);
            } catch(err) {
              showStatus('Error: ' + err.message);
            }
          }, 50);
        } catch(err) {
          showStatus('Could not read file: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function showStatus(msg) {
      const s = document.getElementById('status');
      s.style.display = 'block';
      document.getElementById('status-text').textContent = msg;
      document.getElementById('results').style.display = 'none';
    }

    function runValidations(wb) {
      const summaryName = wb.SheetNames.find(n => n.toLowerCase() === 'summary');
      if (!summaryName) throw new Error('No Summary tab found.');
      const ws = wb.Sheets[summaryName];
      return {
        check1: runCheck1(wb, ws),
        check2: runCheck2(wb),
        check3: runCheck3(wb, ws)
      };
    }

    function runCheck1(wb, ws) {
      const issues = [];
      const tabNames = wb.SheetNames.filter(n => n.toLowerCase() !== 'summary');
      const tabNamesStripped = new Set(tabNames.map(t => t.trim()));

      const row1Names = [];
      let col = 2;
      while (col <= 100) {
        const addr = XLSX.utils.encode_cell({r: 0, c: col});
        const cell = ws[addr];
        if (cell && cell.v != null && String(cell.v).trim()) {
          row1Names.push(String(cell.v).trim());
        }
        col++;
      }
      const row1Set = new Set(row1Names);

      for (const name of row1Set) {
        if (!tabNamesStripped.has(name)) {
          const close = tabNames.find(t => t.trim().toLowerCase() === name.toLowerCase());
          if (close) {
            issues.push({type: 'mismatch', msg: `"${name}" in Summary row 1 vs tab "${close}" — spacing or casing difference`});
          } else {
            issues.push({type: 'missing-tab', msg: `"${name}" is in Summary row 1 but has no matching tab`});
          }
        }
      }
      for (const tab of tabNames) {
        const stripped = tab.trim();
        if (!row1Set.has(stripped)) {
          const close = [...row1Set].find(n => n.toLowerCase() === stripped.toLowerCase());
          if (!close) {
            issues.push({type: 'missing-row1', msg: `Tab "${tab}" has no matching name in Summary row 1`});
          }
        }
      }
      return issues;
    }

    function runCheck2(wb) {
      const issues = [];
      for (const sheetName of wb.SheetNames) {
        if (sheetName.toLowerCase() === 'summary') continue;
        const ws = wb.Sheets[sheetName];
        if (!ws || !ws['!ref']) continue;
        const range = XLSX.utils.decode_range(ws['!ref']);

        let monthCol = -1;
        for (let c = 0; c <= range.e.c; c++) {
          const cell = ws[XLSX.utils.encode_cell({r: 0, c})];
          if (cell && String(cell.v || '').trim().toLowerCase() === 'month') {
            monthCol = c; break;
          }
        }
        if (monthCol === -1) continue;

        for (let r = 1; r <= range.e.r; r++) {
          const colDCell = ws[XLSX.utils.encode_cell({r, c: 3})];
          const colDVal = colDCell ? String(colDCell.v || '').trim().toLowerCase() : '';
          if (colDVal === 'total amount left') break;

          const hasData = [0,1,2,3].some(c => {
            const cell = ws[XLSX.utils.encode_cell({r, c})];
            return cell && cell.v != null && String(cell.v).trim() !== '';
          });
          if (!hasData) continue;

          const monthCell = ws[XLSX.utils.encode_cell({r, c: monthCol})];
          const hasMonth = monthCell && monthCell.v != null && String(monthCell.v).trim() !== '';
          if (!hasMonth) {
            const dateCell = ws[XLSX.utils.encode_cell({r, c: 0})];
            const amtCell = ws[XLSX.utils.encode_cell({r, c: 3})];
            let dateStr = '?';
            if (dateCell && dateCell.v) {
              dateStr = dateCell.t === 'n'
                ? new Date(Math.round((dateCell.v - 25569) * 86400 * 1000)).toLocaleDateString()
                : String(dateCell.v);
            }
            issues.push({tab: sheetName, row: r + 1, date: dateStr, amount: amtCell ? amtCell.v : '?'});
          }
        }
      }
      return issues;
    }

    function runCheck3(wb, ws) {
      const issues = [];
      const tabNames = wb.SheetNames.filter(n => n.toLowerCase() !== 'summary');

      for (let rowIdx = 6; rowIdx <= 21; rowIdx++) {
        if (rowIdx === 20) continue;
        const labelCell = ws[XLSX.utils.encode_cell({r: rowIdx, c: 0})] || ws[XLSX.utils.encode_cell({r: rowIdx, c: 1})];
        const rowLabel = labelCell ? String(labelCell.v || '').trim() : '';

        for (let i = 0; i < tabNames.length; i++) {
          const tab = tabNames[i];
          const colIdx = i + 2;
          const colLetter = XLSX.utils.encode_col(colIdx);
          const cell = ws[XLSX.utils.encode_cell({r: rowIdx, c: colIdx})];

          if (!cell || cell.v == null) continue;
          const formula = cell.f ? '=' + cell.f : null;
          if (!formula) continue;

          const norm = s => s.toUpperCase().replace(/\s/g, '');
          const needsQuotes = /[ .()]/.test(tab);
          const tabRef = needsQuotes ? `'${tab}'` : tab;

          if (rowIdx >= 6 && rowIdx <= 18) {
            const expected = `=SUMIF(${tabRef}!$G:$G,$B${rowIdx+1},${tabRef}!$D:$D)`;
            if (norm(formula) !== norm(expected)) {
              issues.push({row: rowIdx+1, label: rowLabel, col: colLetter, tab, expected, got: formula});
            }
          } else if (rowIdx === 19) {
            const expected = `=SUM(${colLetter}7:${colLetter}19)`;
            if (norm(formula) !== norm(expected)) {
              issues.push({row: rowIdx+1, label: 'Total Payments', col: colLetter, tab, expected, got: formula});
            }
          } else if (rowIdx === 21) {
            const expected = `=${colLetter}2-${colLetter}20`;
            if (norm(formula) !== norm(expected)) {
              issues.push({row: rowIdx+1, label: 'Remaining Balance', col: colLetter, tab, expected, got: formula});
            }
          }
        }
      }
      return issues;
    }

    function badge(count) {
      if (count === 0) return `<span class="badge-ok">✓ All clear</span>`;
      return `<span class="badge-err">✕ ${count} issue${count > 1 ? 's' : ''}</span>`;
    }

    function issueBlock(title, issues, renderFn) {
      const hasIssues = issues.length > 0;
      const cls = hasIssues ? 'has-issues' : 'all-clear';
      const countBadge = hasIssues ? `<span class="issue-count">${issues.length}</span>` : '';
      const rows = hasIssues
        ? issues.map(renderFn).join('')
        : `<tr class="ok-row"><td colspan="3">✓ No issues found</td></tr>`;
      return `
        <div class="issue-block ${cls}">
          <div class="issue-block-header">${title}${countBadge}</div>
          <table>${rows}</table>
        </div>`;
    }

    function showResults(r) {
      document.getElementById('status').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      document.getElementById('badge-1').innerHTML = badge(r.check1.length);
      document.getElementById('badge-2').innerHTML = badge(r.check2.length);
      document.getElementById('badge-3').innerHTML = badge(r.check3.length);

      const typeLabel = {mismatch: 'Name mismatch', 'missing-tab': 'Missing tab', 'missing-row1': 'Missing from Summary'};

      const block1 = issueBlock('Check 1 — Tab ↔ Summary name matching', r.check1, issue =>
        `<tr><td class="muted">${typeLabel[issue.type] || issue.type}</td><td colspan="2">${issue.msg}</td></tr>`);

      const block2 = issueBlock('Check 2 — Month column coverage', r.check2, issue =>
        `<tr><td class="muted">${issue.tab}</td><td>Row ${issue.row}</td><td>Date: ${issue.date} · Amount: $${Number(issue.amount).toLocaleString()}</td></tr>`);

      const block3 = issueBlock('Check 3 — Summary formula consistency', r.check3, issue =>
        `<tr><td class="muted">${issue.col} (${issue.tab})</td><td>Row ${issue.row} — ${issue.label}</td><td>${issue.expected}<span class="sub">Got: ${issue.got}</span></td></tr>`);

      document.getElementById('issues-container').innerHTML = block1 + block2 + block3;
    }
  </script>
</body>
</html>
